    <script>
      // Ensure trailing slash for GitHub Pages repository subpaths so relative assets (./assets/...) resolve correctly
      (function() {
        var path = window.location.pathname;
        if (!path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(window.location.protocol + '//' + window.location.host + path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
